default: &default
  adapter: postgresql
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000

development:
  <<: *default
  url: <%= nil %>  # explicitly blank so it can't fall back to ENV DATABASE_URL
  host: <%= ENV.fetch("DEV_DB_HOST", "localhost") %>
  username: <%= ENV.fetch("DEV_DB_USERNAME", "postgres") %>
  password: <%= ENV.fetch("DEV_DB_PASSWORD", "password") %>

test:
  <<: *default
  database: bookstore_test

production:
  primary:
    <<: *default
    url: <%= ENV["DATABASE_URL"] || ENV["PROD_DATABASE_URL"] %>
    sslmode: require
  cache:
    <<: *default
    url: <%= ENV["DATABASE_URL"] || ENV["PROD_DATABASE_URL"] %>
    sslmode: require
    migrations_paths: db/cache_migrate
  queue:
    <<: *default
    url: <%= ENV["DATABASE_URL"] || ENV["PROD_DATABASE_URL"] %>
    sslmode: require
    migrations_paths: db/queue_migrate
  cable:
    <<: *default
    url: <%= ENV["DATABASE_URL"] || ENV["PROD_DATABASE_URL"] %>
    sslmode: require
    migrations_paths: db/cable_migrate
